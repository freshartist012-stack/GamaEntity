name: Build Signed AAB

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Clean
        run: ./gradlew clean
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE }}" | base64 -d > keystore.jks
      - name: Build Free AAB
        run: |
          ./gradlew bundleFreeRelease \
          -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/keystore.jks \
          -Pandroid.injected.signing.store.password=${{ secrets.STORE_PASSWORD }} \
          -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
          -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}
      - name: Build Pro APK
        run: |
          ./gradlew assembleProRelease \
          -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/keystore.jks \
          -Pandroid.injected.signing.store.password=${{ secrets.STORE_PASSWORD }} \
          -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
          -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}
      - name: Verify APK signed
        run: |
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -1)/apksigner verify --verbose app/build/outputs/apk/pro/release/app-pro-release.apk
      - name: Upload Free AAB
        uses: actions/upload-artifact@v4
        with:
          name: GamaEntity-free-release
          path: app/build/outputs/bundle/freeRelease/app-free-release.aab
      - name: Upload Pro APK
        uses: actions/upload-artifact@v4
        with:
          name: GamaEntity-pro-release
          path: app/build/outputs/apk/pro/release/app-pro-release.apk
